# `using-agent-skills` routes to skills that already carry descriptions of
# their own, so its always-loaded description is duplicated context; the
# phase-to-skill index also lives in the global CLAUDE.md.
# `autonomous-plan-execution` runs a whole plan hands-off after one approval —
# the widest blast radius here, and a decision to make by hand.
[source.frontmatter]
using-agent-skills = { disable-model-invocation = true }
autonomous-plan-execution = { disable-model-invocation = true }

