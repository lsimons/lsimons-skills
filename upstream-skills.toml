# Shipped by the memex CLI (see memex/install.py). `memex setup` installs
# these too, but it prompts for a TTY, so fetch them declaratively instead.
# `memex-search` already carries the prefix and keeps its name.
[[source]]
repository = "https://github.com/nicosuave/memex"
prefix = "memex-"
license = "MIT"
copyright = "Copyright (c) 2026 Nico Ritschel"
skills = ["memex-search", "instruction-improver"]

