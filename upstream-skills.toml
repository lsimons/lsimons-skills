# Skills vendored into skills/, fetched with the skills.sh CLI.
#
# `scripts/update_skills.py` reads this file (`mise run skills-install` /
# `mise run skills-update`). Fetched directories ARE committed here, so a
# re-fetch shows up as a reviewable git diff.
#
# Each [[source]] declares one upstream repository:
#
#   repository  git URL passed to `skills add`
#   prefix      namespace prepended to every skill name from this source,
#               unless the upstream name already starts with it
#   rename      per-skill override, winning over `prefix`
#   skills      upstream skill names to fetch
#   frontmatter per-skill YAML frontmatter overrides, applied after the fetch
#   license     upstream license; see the Licensing section of README.md
#   copyright   upstream copyright holder(s); mirrored into LICENSE
#
# `frontmatter` is keyed by upstream skill name, and exists for
# `disable-model-invocation`: whether an agent can fire a skill by itself is a
# vendoring decision, and upstream packs other than Matt Pocock's never make
# it. See AGENTS.md for when to set it.
#
# Prefixes exist because skill names are a flat global namespace and packs
# collide: superpowers and osmani-agent-skills both ship a
# `test-driven-development`. Renaming a skill also breaks references to it in
# other skills' prose, which is handled separately — see AGENTS.md and
# skill-rewrites.toml.

# Hand-maintained here, never fetched and never pruned.
local = ["1password", "claude-history", "leo-bot", "python-knowledge-patch"]

[[source]]
repository = "https://github.com/vercel-labs/skills"
prefix = "vercel-"
license = "MIT"
copyright = "Copyright (c) 2026 Vercel, Inc."
skills = ["find-skills"]

# A router over skills that are not installed, triggering on anything shaped
# like "how do I do X" — too loose for something that installs code.
[source.frontmatter]
find-skills = { disable-model-invocation = true }

[[source]]
repository = "https://github.com/vercel-labs/agent-browser"
prefix = "vercel-"
license = "Apache-2.0"
copyright = "Copyright 2025 Vercel Inc."
