[project]
name = "lsimons-skills"
version = "0.1.0"
description = "A collection of agent skills"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []
authors = [
    { name = "lsimons" }
]

[tool.ruff]
line-length = 100
target-version = "py314"
# skills/ and disabled/ are vendored upstream content. ruff formats Python
# code blocks inside markdown, so without this it rewrites other people's
# skills — which makes `skills-update` produce spurious diffs and `lint` fail
# on a fresh fetch.
exclude = ["skills", "disabled"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["scripts", "tests"]
exclude = [".venv/**", "**/__pycache__/**"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "basedpyright>=1.39.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=scripts --cov-report=term-missing --cov-fail-under=80"

[tool.uv]
package = false
exclude-newer = "1 week"
