name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          cache: true

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install
        run: mise run install

      - name: Lint
        run: mise run lint

      - name: Placeholders
        run: mise run placeholders

      - name: Typecheck
        run: mise run typecheck

      - name: Test
        run: mise run test

  vuln:
    name: OSV (dependency vulnerability scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          cache: true

      # Runs the same mise-pinned osv-scanner as `mise run vuln` locally,
      # so there is no separate version to keep in step. The task also
      # asserts every committed lockfile was actually opened. It covers
      # uv.lock only: the npm CLIs skills-update runs via npx are in no
      # lockfile (see the comment on [tasks.vuln] in .mise.toml).
      - name: Scan every committed lockfile against the OSV database
        run: mise run vuln

  zizmor:
    name: Zizmor (GitHub Actions audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows (zizmor)
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          # The action defaults to version "latest"; pin it so a zizmor
          # release cannot turn CI red on its own. Must match the zizmor
          # in .mise.toml for `mise run audit` to be a real local mirror
          # — bump them together.
          #
          # `collect` is deliberately left at its default, which already
          # collects every input kind (workflows, actions, dependabot,
          # pre-commit) while respecting .gitignore.
          version: "1.31.1"
