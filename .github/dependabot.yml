version: 2
updates:
  # `uv`, not `pip`: the manifest here is pyproject.toml + uv.lock, and only
  # the uv ecosystem understands `[dependency-groups]` and updates the lockfile.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
