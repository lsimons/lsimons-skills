# Cross-reference rewrites replayed by `scripts/rewrites.py` after each fetch.
#
# Renaming a vendored skill breaks references to its old name in other skills'
# prose. Many upstream names are also ordinary words (`research`, `implement`,
# `terraform`, `brainstorming`, `triage`), so this cannot be find-and-replace:
# each pair below is a judgement that a specific string means the skill and not
# the word. Bare prose is deliberately left alone.
#
# Keyed by local skill name, then by path relative to the skill directory.
# Pairs are literal, applied to every occurrence, in the order listed —
# longest first, so `superpowers:writing-plans` fires before `writing-plans`.
#
# Regenerate the triage worklist with `mise run skills-refs`. See AGENTS.md.


